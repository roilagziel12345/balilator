server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;

    # The app is fully static and makes no outbound requests, so lock everything to same-origin.
    add_header Content-Security-Policy "default-src 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        expires -1;
    }

    location ~* \.(png|jpe?g)$ {
        expires 7d;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
